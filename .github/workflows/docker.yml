name: Docker

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2"
          skip-verify-signature: true

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ matrix.arch }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-swiftpm-

      - name: Build binary
        run: swift build -c release --product lyarrics --static-swift-stdlib

      - name: Stage binary for Docker
        run: cp .build/release/lyarrics lyarrics-${{ matrix.arch }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: lyarrics-${{ matrix.arch }}
          path: lyarrics-${{ matrix.arch }}

  docker:
    needs: build-binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: lyarrics-*
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x lyarrics-amd64 lyarrics-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (all platforms, validate only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build (amd64, loaded for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: lyarrics:smoke-test
          cache-from: type=gha

      - name: Smoke test image
        run: docker run --rm --entrypoint /usr/local/bin/lyarrics-bin lyarrics:smoke-test --version
